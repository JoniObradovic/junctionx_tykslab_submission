[project]
name = "tykslab-antibiogram"
version = "1.0.0"
description = "Continuously refreshed, unit-scoped cumulative antibiogram with anomaly detection and a decision-model Ask box. JunctionX Turku 2026 - TYKS Laboratories, synthetic data."
requires-python = ">=3.10,<3.14"   # torch 2.7.1 ships wheels up to Python 3.13; .python-version pins 3.13
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
]

[dependency-groups]
# The Ask endpoint: rules plus the Laya decision model on CPU.
ai = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "laya>=0.4.10",
    "torch==2.7.1",
]

[tool.uv]
package = false

# On Linux the default PyPI wheel of torch carries CUDA libraries (several GB); the endpoint
# only needs the CPU build. Training on a GPU uses docker/Dockerfile.laya or overrides this.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# torch 2.7.1 is the build the checkpoint was trained and evaluated with.
